/* ===== 顶栏 ===== */

"use strict";
/* ---------- 云端同步配置 ----------
   在 Supabase 项目设置中复制 URL 和 anon public key 到下面两项。
   不要填写 service_role 管理员密钥，也不要把它公开。 */
var SUPABASE_URL = '';
var SUPABASE_ANON_KEY = '';
var cloud = { client: null, user: null, ready: false };

function cloudConfigured(){ return !!(SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase); }
function setCloudBadge(text){
  var badge = document.getElementById('storageBadge');
  var btn = document.getElementById('cloudSyncBtn');
  if (badge) badge.textContent = text;
  if (btn) btn.textContent = cloud.user ? '退出云端' : '云端同步';
}
async function initCloud(){
  if (!cloudConfigured()) return;
  cloud.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  var result = await cloud.client.auth.getUser();
  cloud.user = result.data && result.data.user ? result.data.user : null;
  cloud.ready = true;
  setCloudBadge(cloud.user ? '云端已同步' : '本地存储');
}
async function cloudLogin(){
  if (!cloudConfigured()) { toast('请先在代码中填写 Supabase URL 和 anon key'); return; }
  var email = window.prompt('请输入邮箱，登录链接会发送到该邮箱：');
  if (!email) return;
  var result = await cloud.client.auth.signInWithOtp({email: email, options:{emailRedirectTo: window.location.href}});
  if (result.error) toast('登录失败：' + result.error.message);
  else toast('登录链接已发送，请打开邮箱完成登录');
}
async function cloudLogout(){
  if (cloud.client) await cloud.client.auth.signOut();
  cloud.user = null; setCloudBadge('本地存储'); toast('已退出云端，当前设备仍保留本地记录');
}
async function loadCloudData(){
  if (!cloud.user) return false;
  var result = await cloud.client.from('user_data').select('data').eq('user_id', cloud.user.id).maybeSingle();
  if (result.error) { toast('读取云端数据失败，请检查数据表和权限'); return false; }
  if (result.data && result.data.data) { state.data = result.data.data; return true; }
  await cloud.client.from('user_data').upsert({user_id: cloud.user.id, data: state.data, updated_at: new Date().toISOString()});
  return true;
}

/* ========================================

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmtDate(d){
  var y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return y + '-' + m + '-' + day;
}
function parseDate(s){
  var p = s.split('-');
  return new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
}
function addDays(s, n){
  var d = parseDate(s); d.setDate(d.getDate()+n); return fmtDate(d);
}
function todayStr(){ return fmtDate(new Date()); }
function nowTime(){
  var d = new Date();
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function weekCn(d){ return ['日','一','二','三','四','五','六'][d.getDay()]; }
function getWeekMonday(d){
  var day = d.getDay();
  var diff = day === 0 ? -6 : 1 - day;
  var r = new Date(d.getTime());
  r.setDate(r.getDate() + diff);
  return r;
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

}

}
function hexToRgb(hex){
  var h = hex.replace('#','');
  return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
}
function shade(hex, lum){
  var rgb = hexToRgb(hex).map(function(v){ return Math.max(0, Math.min(255, Math.round(v*lum))); });
  return 'rgb(' + rgb.join(',') + ')';
}
function rgba(hex, a){

  return 'rgba(' + rgb.join(',') + ',' + a + ')';
}
function toast(msg){

  setTimeout(function(){

}

function seedData(){
  var data = emptyData();
  var today = todayStr();
  var mk = function(id, name, icon, color){
    return { id: id, name: name, icon: icon, color: color, createdAt: addDays(today, -35), archived: false };
  };

    mk('h_sleep', '早睡', 'moon', '#8B5CF6'),
    mk('h_wake', '早起', 'sun', '#F97316'),

    mk('h_oral', '口语练习', 'mic', '#3B82F6')

    h_sport: expandBlocks([[1,3],[0,4],[1,2],[0,6],[1,5],[0,2],[1,6],[0,1],[1,4],[0,1]]), // 昨天漏卡
    h_oral:  expandBlocks([[1,7],[0,1],[1,4],[0,2],[1,3],[0,1],[1,6],[0,2],[1,2],[0,1],[1,5]]) // 末 5 连 + 今天
  };

    var rec = {};
    var p = patterns[hid];
    for (var i=0;i<p.length;i++){
      if (p[i] === '1'){
        var day = addDays(today, -(p.length - i));
        rec[day] = '21:3' + (i % 10);
      }

    data.records[hid] = rec;

function loadData(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw){ state.data = JSON.parse(raw); }
  }catch(e){ state.data = null; }
  if (!state.data || !Array.isArray(state.data.habits)){
    state.data = seedData();
    saveData();
  }
  if (!state.data.records) state.data.records = {};
  if (!state.data.notes) state.data.notes = [];
  if (!state.data.meta) state.data.meta = {};
}
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  }catch(e){
    toast('存储空间不足，请尽快导出备份');
  }
  if (cloud.user){
    cloud.client.from('user_data').upsert({user_id: cloud.user.id, data: state.data, updated_at: new Date().toISOString()})
      .then(function(r){ if (r.error) toast('云端保存失败，请检查网络'); });
  }
}

/* ========================================
   计算层
   ======================================== */

function habitDays(h){
  var days=Array.isArray(h.weekdays)?h.weekdays.filter(function(d){return Number.isInteger(d)&&d>=0&&d<=6;}):[];
  return days.length ? Array.from(new Set(days)) : [0,1,2,3,4,5,6];
}
function recordTimes(hid,d){
  var r=(state.data.records[hid]||{})[d];
  return Array.isArray(r)?r.filter(function(t){return typeof t==='string'&&t.length>0;}):(typeof r==='string'&&r?[r]:[]);
}
function recordCount(hid,d){return recordTimes(hid,d).length;}
function recordTime(hid,d){var times=recordTimes(hid,d);return times.length?times[times.length-1]:'';}
function isScheduled(h,d){
  if(!h || (h.createdAt && d<h.createdAt.slice(0,10))) return false;
  var days=habitDays(h);
  if(Array.isArray(h.scheduleHistory)&&h.scheduleHistory.length){
    days=[0,1,2,3,4,5,6];
    h.scheduleHistory.slice().sort(function(a,b){return a.from.localeCompare(b.from);}).forEach(function(v){if(v.from<=d)days=v.days;});
  }
  return days.indexOf(parseDate(d).getDay())>=0;
}
function isPlanned(h,d){return isScheduled(h,d)||isDone(h.id,d);}
function scheduledCount(h,days){return days.filter(function(d){return d<=todayStr()&&isPlanned(h,d);}).length;}
function scheduleLabel(h){return (h.checkinType==='count'?'统计次数':'单次打卡')+' · '+(habitDays(h).length===7?'每天':habitDays(h).slice().sort(function(a,b){return (a||7)-(b||7);}).map(function(d){return '周'+['日','一','二','三','四','五','六'][d];}).join('、'));}
function setSettingsForm(h){
 document.querySelectorAll('[name="checkinType"]').forEach(function(e){e.checked=e.value===(h&&h.checkinType==='count'?'count':'single');});
 var days=h?habitDays(h):[0,1,2,3,4,5,6];
 document.querySelectorAll('[name="habitWeekday"]').forEach(function(e){e.checked=days.indexOf(Number(e.value))>=0;});
}
function applyHabitSettings(h,type,days,isNew){
 if(isNew){h.weekdays=days.slice();h.scheduleHistory=[{from:todayStr(),days:days.slice()}];}
 else if(habitDays(h).slice().sort().join()!==days.slice().sort().join()){
  if(!Array.isArray(h.scheduleHistory)||!h.scheduleHistory.length)h.scheduleHistory=[{from:h.createdAt||'1900-01-01',days:habitDays(h)}];
  h.scheduleHistory=h.scheduleHistory.filter(function(v){return v.from!==todayStr();});
  h.scheduleHistory.push({from:todayStr(),days:days.slice()});h.weekdays=days.slice();
 }
 h.checkinType=type;
}

function getActiveHabits(){
  return state.data.habits.filter(function(h){ return !h.archived; });
}
function getHabit(id){
  for (var i=0;i<state.data.habits.length;i++){
    if (state.data.habits[i].id === id) return state.data.habits[i];
  }
  return null;
}
function isDone(hid, dateStr){
 return recordCount(hid,dateStr)>0;
}
function getStreak(hid){
 var h=getHabit(hid);if(!h)return {current:0,longest:0};
 var keys=Object.keys(state.data.records[hid]||{}).filter(function(d){return d<=todayStr()&&isDone(hid,d);}).sort();
 if(!keys.length)return {current:0,longest:0};
 var current=0,longest=0,run=0;
 for(var d=keys[0];d<=todayStr();d=addDays(d,1)){
  if(!isPlanned(h,d))continue;
  if(isDone(hid,d)){run++;longest=Math.max(longest,run);}
  else if(d!==todayStr())run=0;
 }
 current=run;return {current:current,longest:longest};
}
function getTodayPending(){
  var t = todayStr();
  return getActiveHabits().filter(function(h){ return isScheduled(h,t) && !isDone(h.id, t); });
}
function getYesterdayMissed(){
  var y = addDays(todayStr(), -1);
  return getActiveHabits().filter(function(h){ return isScheduled(h,y) && !isDone(h.id, y); });
}
function getTotalRecords(){
 var n=0;Object.keys(state.data.records).forEach(function(hid){Object.keys(state.data.records[hid]||{}).forEach(function(d){n+=recordCount(hid,d);});});return n;
}
function getGlobalLongest(){
  var m = 0;
  state.data.habits.forEach(function(h){
    var s = getStreak(h.id);
    if (s.longest > m) m = s.longest;
  });
  return m;
}
function getWeekDays(offset){
  /* 返回某周（offset=0 本周）的 7 天日期，周一开头 */
  var monday = getWeekMonday(parseDate(todayStr()));
  monday.setDate(monday.getDate() + offset * 7);
  var days = [];
  for (var i=0;i<7;i++){ days.push(addDays(fmtDate(monday), i)); }
  return days;
}
function getWeekMatrix(){
  return getWeekDays(state.weekOffset);
}
function getHabitWeekDone(hid){
  var days = getWeekDays(0); /* 习惯卡固定统计本周 */
  var done = 0;
  days.forEach(function(d){ if (isDone(hid, d)) done++; });
  return done;
}
function getMonthDays(year, month){
  /* month: 0-11，返回该月所有日期字符串 */
  var n = new Date(year, month+1, 0).getDate();
  var arr = [];
  for (var i=1;i<=n;i++){
    arr.push(year + '-' + String(month+1).padStart(2,'0') + '-' + String(i).padStart(2,'0'));
  }
  return arr;
}
function getMonthDone(hid, year, month){
  var days = getMonthDays(year, month);
  var done = 0;
  days.forEach(function(d){ if (isDone(hid, d)) done++; });
  return done;
}
function getMilestones(hid){
  var s = getStreak(hid);
  return MILESTONES.map(function(m){
    return { day: m, reached: s.longest >= m };
  });
}
function justHitMilestone(hid){
  var cur = getStreak(hid).current;
  return MILESTONES.indexOf(cur) >= 0 ? cur : 0;
}
function pickQuote(habitName){
  var n = habitName || '';
  var pool = QUOTES.common;
  if (/睡|晚安/.test(n)) pool = QUOTES.sleep;
  else if (/早|晨|起/.test(n)) pool = QUOTES.morning;
  else if (/运动|跑|健身|锻炼|步|瑜伽/.test(n)) pool = QUOTES.sport;
  else if (/口语|英语|读|学|背|练|写|琴|画/.test(n)) pool = QUOTES.study;
  return pool[Math.floor(Math.random() * pool.length)];
}

    var rec = recs[h.id] || {};
    var n = 0;
    for (var d in rec){ if (d.slice(0,4) == year){ n++; yearCount++; } }
    perHabit[h.id] = n;
  });
  var dayCounts = {};
  for (var hid in recs){
    for (var d in recs[hid]){
      if (d >= addDays(today, -364)){
        dayCounts[d] = (dayCounts[d] || 0) + 1;
        if (dayCounts[d] > maxDay){ maxDay = dayCounts[d]; maxDayDate = d; }
      }
    }
  }
  var activeDays = Object.keys(dayCounts).length;

  var cols = [];
  var colDate = startMonday;
  while (fmtDate(colDate) <= today){
    var col = [];
    for (var r=0;r<7;r++){
      var ds = fmtDate(colDate);
      col.push({ date: ds, inRange: ds >= start && ds <= today, count: dayCounts[ds] || 0 });
      colDate = new Date(colDate.getTime());
      colDate.setDate(colDate.getDate() + 1);
    }
    cols.push(col);
  }

  var heatHtml = '';
  cols.forEach(function(col){
    var cells = '';
    col.forEach(function(c){
      var lv = '';
      if (c.inRange){
        if (c.count >= 4) lv = ' heat-lv4';
        else if (c.count === 3) lv = ' heat-lv3';
        else if (c.count === 2) lv = ' heat-lv2';
        else if (c.count === 1) lv = ' heat-lv1';
      } else {
        lv = ' heat-cell';
        cells += '<div class="heat-cell" style="background:transparent;"></div>';
        return;
      }
      cells += '<div class="heat-cell' + lv + '" title="' + c.date + ' 完成 ' + c.count + ' 个习惯"></div>';
    });
    heatHtml += '<div class="heat-col">' + cells + '</div>';
  });

  var bestHabit = '', bestN = 0;
  for (var bh in perHabit){
    if (perHabit[bh] > bestN){ bestN = perHabit[bh]; bestHabit = (getHabit(bh)||{}).name || ''; }
  }

  el.innerHTML =
    '<div class="nav-row"><span class="nav-t">最近 365 天热力图</span></div>'
    + '<div class="heat-wrap"><div class="heat-inner">' + heatHtml + '</div>'
    + '<div class="heat-legend"><span>少</span><i class="heat-cell"></i><i class="heat-cell heat-lv1"></i><i class="heat-cell heat-lv2"></i><i class="heat-cell heat-lv3"></i><i class="heat-cell heat-lv4"></i><span>多</span></div>'
    + '</div>'
    + '<p class="year-stat-line">'
    + '今年累计完成 <b>' + yearCount + '</b> 个习惯日；最近一年有 <b>' + activeDays + '</b> 天在坚持，'
    + (bestHabit ? '最勤奋的习惯是 <b>' + esc(bestHabit) + '</b>（' + bestN + ' 次）' : '')
    + (maxDayDate ? '；最高纪录：' + maxDayDate.slice(5).replace('-','月') + '日一天完成 <b>' + maxDay + '</b> 个习惯' : '')
    + '。</p>'
    + '<p class="tip">颜色越深，代表当天完成的习惯越多。横向滑动可查看完整一年。</p>';
}

/* ========================================
   打卡 / 撤销 / 分享卡片
   ======================================== */
function doCheckIn(hid){
 var h=getHabit(hid),today=todayStr();
 if(!h||h.archived)return;
 if(!isPlanned(h,today)){toast('今天是休息日');return;}
 if(h.checkinType!=='count'&&isDone(hid,today)){toast('今天已经打过卡啦');return;}
 if(!state.data.records[hid])state.data.records[hid]={};
 if(h.checkinType==='count'){var times=recordTimes(hid,today).slice();times.push(nowTime());state.data.records[hid][today]=times;}
 else state.data.records[hid][today]=nowTime();
 state.data.meta.isDemo=false;saveData();refreshAll();maybeBackupHint();
 if(h.checkinType==='count')toast('已记录，今日 '+recordCount(hid,today)+' 次');else showShareCard(hid,true);
}
function undoCheckIn(hid){
 var today=todayStr(),rec=state.data.records[hid],h=getHabit(hid);
 if(!rec||!isDone(hid,today))return;
 var times=recordTimes(hid,today).slice();
 if(h&&h.checkinType==='count'&&times.length>1){times.pop();rec[today]=times;}
 else delete rec[today];
 saveData();refreshAll();toast(h&&h.checkinType==='count'?'已撤销 1 次':'已撤销今日打卡');
}
function showShareCard(hid, isNew){
  var h = getHabit(hid);
  if (!h) return;
  state.shareHabitId = hid;
  state.shareQuote = pickQuote(h.name);
  document.getElementById('shareTitle').textContent = isNew ? '打卡成功！' : '分享我的坚持';
  document.getElementById('modalShare').hidden = false;
  drawShareCard();
}
function drawShareCard(){
  var canvas = document.getElementById('shareCanvas');
  var h = getHabit(state.shareHabitId);
  if (!h) return;
  var s = getStreak(h.id);
  var W = 750, H = 1000;
  canvas.width = W; canvas.height = H;
  var ctx = canvas.getContext('2d');

  /* 背景渐变 */
  var g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, shade(h.color, 1.05));
  g.addColorStop(1, shade(h.color, 0.45));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  /* 装饰圆 */
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  ctx.beginPath(); ctx.arc(W - 90, 120, 190, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(60, H - 160, 150, 0, Math.PI*2); ctx.fill();

  ctx.textAlign = 'center';
  var white = '#FFFFFF';

  /* 日期 */
  var td = parseDate(todayStr());
  ctx.fillStyle = 'rgba(255,255,255,.82)';
  ctx.font = '400 26px ' + getCanvasFont();
  ctx.fillText(td.getFullYear() + ' 年 ' + (td.getMonth()+1) + ' 月 ' + td.getDate() + ' 日 · 星期' + weekCn(td), W/2, 92);

  /* 图标圆 */
  var cy = 210;
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.beginPath(); ctx.arc(W/2, cy, 62, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.85)';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  var p = new Path2D((ICONS[h.icon] || ICONS.star).d);
  ctx.save();
  ctx.translate(W/2 - 27, cy - 27);
  ctx.scale(54/24, 54/24);
  ctx.stroke(p);
  ctx.restore();

  /* 习惯名 */
  ctx.fillStyle = white;
  ctx.font = '700 52px ' + getCanvasFont();
  ctx.fillText(h.name, W/2, 348);

  /* 连续打卡 */
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.font = '400 28px ' + getCanvasFont();
  ctx.fillText('已连续打卡', W/2, 430);

  /* 大数字 */
  ctx.font = '800 168px ' + getCanvasFont();
  var numW = ctx.measureText(String(s.current)).width;
  ctx.fillText(String(s.current), W/2 - 26, 590);
  ctx.font = '700 46px ' + getCanvasFont();
  ctx.textAlign = 'left';
  ctx.fillText('天', W/2 - 26 + numW/2 + 12, 590);
  ctx.textAlign = 'center';

  /* 金色装饰线 */
  ctx.strokeStyle = 'rgba(255,214,102,.95)';
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(W/2 - 34, 660); ctx.lineTo(W/2 + 34, 660); ctx.stroke();

  /* 金句（自动换行，最多两行半） */
  ctx.fillStyle = white;
  ctx.font = '500 33px ' + getCanvasFont();
  var quote = state.shareQuote;
  var lines = [], line = '';
  for (var i=0;i<quote.length;i++){
    var ch = quote[i];
    if (ctx.measureText(line + ch).width > 580){ lines.push(line); line = ch; }
    else { line += ch; }
  }
  if (line) lines.push(line);
  lines = lines.slice(0, 2);
  var qy = 726;
  lines.forEach(function(ln){
    ctx.fillText(ln, W/2, qy);
    qy += 48;
  });

  /* 里程碑 */
  var hit = justHitMilestone(h.id);
  if (hit > 0){
    ctx.fillStyle = '#FDE68A';
    ctx.font = '700 30px ' + getCanvasFont();
    ctx.fillText('达成 ' + hit + ' 天里程碑！', W/2, qy + 16);
    qy += 48;
  }

  /* 底部 */
  ctx.fillStyle = 'rgba(255,255,255,.72)';
  ctx.font = '400 24px ' + getCanvasFont();
  ctx.fillText('累计打卡 ' + Object.keys(state.data.records[h.id] || {}).length + ' 次 · 最长连击 ' + s.longest + ' 天', W/2, 916);
  ctx.font = '400 22px ' + getCanvasFont();
  ctx.fillText('—— 我的习惯打卡工作台 ——', W/2, 956);
}
function getCanvasFont(){
  return '-apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif';
}
function saveCardImage(){
  var canvas = document.getElementById('shareCanvas');
  var h = getHabit(state.shareHabitId);
  var name = h ? h.name : '打卡';
  var filename = '打卡卡片_' + name + '_' + todayStr() + '.png';
  if (canvas.toBlob){
    canvas.toBlob(function(blob){
      if (blob){ downloadBlob(blob, filename); }
      else { fallbackSave(canvas, filename); }
    }, 'image/png');
  } else {
    fallbackSave(canvas, filename);
  }
}
function fallbackSave(canvas, filename){
  try{
    var a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }catch(e){
    toast('当前浏览器不支持保存，可长按图片保存');
  }
}

function submitHabitForm(){
  var input = document.getElementById('habitNameInput');
  var name = input.value.trim();
  if (!name){ toast('请输入习惯名称'); input.focus(); return; }
  if (name.length > 12){ toast('名称最多 12 个字'); return; }
  var dup = state.data.habits.some(function(h){
    return h.name === name && h.id !== state.editingHabitId;
  });
  if (dup){ toast('已有同名习惯'); return; }
  var weekdays=Array.from(document.querySelectorAll('[name="habitWeekday"]:checked')).map(function(e){return Number(e.value);});
  if(!weekdays.length){toast('请至少选择一个打卡日');return;}
  var checkinType=document.querySelector('[name="checkinType"]:checked').value;

  if (state.editingHabitId){
    var h = getHabit(state.editingHabitId);
    if (h){
      h.name = name; h.icon = state.formIcon; h.color = state.formColor;
      applyHabitSettings(h,checkinType,weekdays,false);
      saveData();
      toast('已保存修改');
    }
  } else {
    state.data.habits.push({
      id: uid(), name: name, icon: state.formIcon, color: state.formColor,
      createdAt: todayStr(), archived: false, checkinType:checkinType, weekdays:weekdays, scheduleHistory:[{from:todayStr(),days:weekdays.slice()}]
    });
    state.data.meta.isDemo = false;
    saveData();
    toast('已添加「' + name + '」，今天记得打卡');
  }
  resetHabitForm();
  refreshAll();
}
function resetHabitForm(){
  setSettingsForm(null);

  state.formIcon = 'star';
  state.formColor = COLORS[0];
  document.getElementById('habitNameInput').value = '';
  document.getElementById('formTitle').textContent = '新增习惯';

function startEditHabit(hid){

function exportJSON(){
  var blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  downloadBlob(blob, '习惯打卡备份_' + todayStr().replace(/-/g,'') + '.json');
  toast('备份文件已下载');
}
function exportCSV(){
  var rows = ['习惯,日期,打卡时间'];
  state.data.habits.forEach(function(h){
    var rec = state.data.records[h.id] || {};
    Object.keys(rec).sort().forEach(function(d){
      recordTimes(h.id,d).forEach(function(t){rows.push('"' + h.name.replace(/"/g,'""') + '",' + d + ',' + t);});
    });
  });
  var blob = new Blob(['\uFEFF' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  downloadBlob(blob, '打卡记录_' + todayStr().replace(/-/g,'') + '.csv');
  toast('CSV 已下载');
}
function importJSONFile(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var obj = JSON.parse(reader.result);
      if (!obj || !Array.isArray(obj.habits) || !obj.records || !Array.isArray(obj.notes)){
        toast('文件格式不正确'); return;
      }
      confirmDialog('导入备份', '导入将覆盖当前全部数据（习惯、打卡记录、笔记），确定继续吗？', '覆盖导入', true, function(){
        state.data = obj;
        if (!state.data.meta) state.data.meta = {};
        state.data.meta.backupBaseline = getTotalRecords();
        saveData();
        refreshAll();
        toast('导入成功，数据已恢复');
      });
    }catch(e){
      toast('文件解析失败');
    }
  };
  reader.readAsText(file);
}

/* ========================================
   事件绑定（统一委托）
   ======================================== */
function bindEvents(){
  document.body.addEventListener('click', function(ev){
    var btn = ev.target.closest('[data-action],[data-view],[data-stats]');
    if (!btn) return;

    /* 视图切换 */
    if (btn.hasAttribute('data-view')){
      switchView(btn.getAttribute('data-view'));
      return;
    }
    /* 统计周期切换 */
    if (btn.hasAttribute('data-stats')){
      state.statsTab = btn.getAttribute('data-stats');
      renderStats();
      return;
    }

    var action = btn.getAttribute('data-action');
    var habitId = btn.getAttribute('data-habit');

    switch (action){
      case 'checkin': doCheckIn(habitId); break;
      case 'undo': undoCheckIn(habitId); break;
      case 'share-card': showShareCard(habitId, false); break;
      case 'add-note': {
        var ta = document.getElementById('noteText');
        var txt = ta.value.trim();
        if (!txt){ toast('写点什么再保存吧'); ta.focus(); return; }
        state.data.notes.push({
          id: uid(), date: todayStr(),
          habitId: document.getElementById('noteHabitSel').value,
          content: txt, createdAt: todayStr() + ' ' + nowTime()
        });
        ta.value = '';
        saveData();
        renderNotes();
        renderSummaryCards();
        toast('已记录');
        break;
      }
      case 'del-note': {
        var nid = btn.getAttribute('data-id');
        confirmDialog('删除笔记', '确定删除这条想法记录吗？', '删除', true, function(){
          state.data.notes = state.data.notes.filter(function(n){ return n.id !== nid; });
          saveData();
          renderNotes();
          renderSummaryCards();
          toast('已删除');
        });
        break;
      }
      case 'pick-icon':
        state.formIcon = btn.getAttribute('data-icon');
        renderFormPickers();
        break;
      case 'pick-color':
        state.formColor = btn.getAttribute('data-color');
        renderFormPickers();
        break;
      case 'submit-habit': submitHabitForm(); break;
      case 'reset-habit-form': resetHabitForm(); break;
      case 'go-manage': switchView('manage'); break;
      case 'edit-habit': startEditHabit(habitId); break;
      case 'archive-habit': {
        var h = getHabit(habitId);
        if (h){
          h.archived = !h.archived;
          saveData();
          refreshAll();
          toast(h.archived ? '已归档（历史数据保留）' : '已恢复');
        }
        break;
      }
      case 'delete-habit': {
        var h2 = getHabit(habitId);
        if (!h2) break;
        confirmDialog('删除习惯', '将删除「' + h2.name + '」及其全部打卡记录，无法恢复。建议先用「导出 JSON 备份」。确定删除吗？', '删除', true, function(){
          state.data.habits = state.data.habits.filter(function(x){ return x.id !== habitId; });
          delete state.data.records[habitId];
          if (state.editingHabitId === habitId) resetHabitForm();
          saveData();
          refreshAll();
          toast('已删除');
        });
        break;
      }
      case 'clear-demo': clearDemoData(); break;
      case 'export-json': exportJSON(); break;
      case 'cloud-sync': cloud.user ? cloudLogout() : cloudLogin(); break;
      case 'export-csv': exportCSV(); break;
      case 'trigger-import': document.getElementById('importFile').click(); break;
      case 'clear-all': clearAllData(); break;
      case 'close-hint': document.getElementById('backupHintBar').hidden = true; break;
      case 'prev-week': state.weekOffset--; renderWeekView(); break;
      case 'next-week': if (state.weekOffset < 0){ state.weekOffset++; renderWeekView(); } break;
      case 'prev-month': state.monthOffset--; renderMonthView(); break;
      case 'next-month': state.monthOffset++; renderMonthView(); break;
      case 'prev-year-month': state.monthOffset -= 12; renderMonthView(); break;
      case 'next-year-month': state.monthOffset += 12; renderMonthView(); break;
      case 'quote-again':
        var hh = getHabit(state.shareHabitId);
        state.shareQuote = pickQuote(hh ? hh.name : '');
        drawShareCard();
        break;
      case 'save-card': saveCardImage(); break;
      case 'close-share': document.getElementById('modalShare').hidden = true; break;
    }
  });

  /* 确认弹层 */
  document.getElementById('btnConfirmOk').addEventListener('click', function(){
    document.getElementById('modalConfirm').hidden = true;
    if (typeof state.confirmCb === 'function'){
      var cb = state.confirmCb;
      state.confirmCb = null;
      cb();
    }
  });
  document.getElementById('btnConfirmCancel').addEventListener('click', function(){
    document.getElementById('modalConfirm').hidden = true;
    state.confirmCb = null;
  });

  /* 导入文件 */
  document.getElementById('importFile').addEventListener('change', function(){
    if (this.files && this.files[0]){
      importJSONFile(this.files[0]);
      this.value = '';
    }
  });

  /* 点遮罩关闭分享弹层 */
  document.getElementById('modalShare').addEventListener('click', function(ev){
    if (ev.target === this) this.hidden = true;
  });
  document.getElementById('modalConfirm').addEventListener('click', function(ev){
    if (ev.target === this){ this.hidden = true; state.confirmCb = null; }
  });
}

/* ========================================
   初始化
   ======================================== */
document.addEventListener('DOMContentLoaded', async function(){
  loadData();
  await initCloud();
  if (cloud.user){
    var hadCloudData = await loadCloudData();
    if (hadCloudData) localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
  }
  var td = parseDate(todayStr());
  document.getElementById('topDate').textContent = todayStr() + ' · 星期' + weekCn(td);
  bindEvents();
  refreshAll();
  switchView('today');
  maybeBackupHint();
});
</script>
</body>
</html>
